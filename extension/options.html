<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Options — Fleuve</title>
  <link rel="stylesheet" href="ui.css" />
  <style> body { max-width: 560px; margin: 32px auto; padding: 0 20px; } h1 { font-size: 18px; margin-bottom: 18px; } </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" /> Options de Fleuve</h1>
  <label><span>Jeton (dans Fleuve : Réglages → Jeton de l'extension → Copier)</span>
    <input type="text" id="token" autocomplete="off" spellcheck="false" /></label>
  <label><span>Port local</span><input type="number" id="port" min="1024" max="65535" /></label>
  <label><span>Intercepter les fichiers de plus de (Mo)</span><input type="number" id="minSizeMb" min="0" step="1" /></label>
  <label><span>…et toujours ces extensions (séparées par des espaces)</span><textarea id="extensions" rows="3"></textarea></label>
  <label class="row" style="gap:8px"><input type="checkbox" id="intercept" /> Intercepter les téléchargements du navigateur</label>
  <div class="row">
    <button class="primary" id="save">Enregistrer</button>
    <button id="test">Tester la connexion</button>
    <span id="msg" class="muted"></span>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
