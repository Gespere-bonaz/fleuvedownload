<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleuve</title>
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 360px; max-width: 100%; padding: 14px 16px 12px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .status[role=button] { cursor: pointer; }
    .status[role=button]:hover { background: var(--line); }

    .switch-row { padding: 8px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .send { display: flex; gap: 8px; }
    .send input { flex: 1; min-width: 0; }
    #quality-slot select.quality { margin-top: 8px; }
    #msg { margin-top: 8px; }
    #msg:empty { display: none; }

    .section-head { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; }
    .count { font-size: 11px; font-weight: 700; min-width: 18px; padding: 0 6px; border-radius: 999px; text-align: center; background: var(--surface); color: var(--muted); }
    .count:empty { display: none; }

    ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; scrollbar-gutter: stable; display: grid; gap: 8px; align-content: start; }
    li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    li .info { min-width: 0; }
    li .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    li .name .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    li .meta { margin-top: 1px; }
    .tag { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .02em; padding: 1px 6px; border-radius: 4px; color: #fff; background: var(--tag-file); }
    .tag.hls { background: var(--tag-hls); }
    .tag.site { background: var(--tag-site); }
    select.quality { margin-top: 6px; min-height: 28px; padding: 2px 8px; font-size: 12px; }

    .empty { padding: 14px 12px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; color: var(--muted); }
    .empty[hidden] { display: none; }

    footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon32.png" alt="" /> Fleuve</h1>
    <span id="status" class="status" role="status"><i></i><span>Vérification…</span></span>
  </header>

  <label class="switch-row">
    <input type="checkbox" class="switch" id="intercept" />
    <span>Intercepter les téléchargements du navigateur</span>
  </label>

  <form class="send" id="send-form">
    <input type="url" id="link" placeholder="Coller un lien…" aria-label="Lien à télécharger" autocomplete="off" />
    <button type="submit" class="primary" id="send">Envoyer</button>
  </form>
  <div id="quality-slot"></div>
  <div id="msg" class="muted" role="status" aria-live="polite"></div>

  <div class="section-head">
    <h2>Détectés dans cet onglet</h2>
    <span class="count" id="count"></span>
  </div>
  <ul id="media"></ul>
  <p id="empty" class="empty">Aucune vidéo détectée.<br />Lancez la lecture : elle apparaîtra ici.</p>

  <footer>
    <button id="options">Options</button>
    <span class="muted">Flux protégés (DRM) non pris en charge</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
