[package]
name = "fleuve"
version = "0.1.0"
description = "Fleuve — gestionnaire de téléchargements pour macOS"
authors = ["Gespère BONAZEBI"]
edition = "2021"

[lib]
name = "fleuve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fleuve-core = { path = "../crates/fleuve-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
